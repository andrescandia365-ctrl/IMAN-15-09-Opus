<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <!-- IMAN — versión maskable para Android, que recorta cada ícono con la
       forma del lanzador (círculo, squircle, gota). El símbolo va al 88% para
       entrar cómodo en la zona segura (80% del diámetro) en vez de rozarla:
       el fondo llega hasta el borde y es lo único que se puede perder. -->
  <rect width="110" height="110" fill="#14130f"/>
  <g transform="translate(55,55) scale(0.88) translate(-55,-55)">
    <path d="M 28,42 V 68 A 27 27 0 0 0 82 68 V 42 H 64 V 68 A 9 9 0 0 1 46 68 V 42 Z" fill="#ebe4d4"/>
    <rect x="28" y="42" width="18" height="13" fill="#8eae8a"/>
    <rect x="64" y="42" width="18" height="13" fill="#8eae8a"/>
    <path d="M 36,36 Q 55,22 74,36" stroke="#8eae8a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 31,33 Q 55,14 79,33" stroke="#8eae8a" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 26,30 Q 55,7 84,30" stroke="#8eae8a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
